
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o "SmartGalleryOrganizer-Phone-Build (2).zip" -d source

      - name: Fix Java compatibility
        run: |
          cat >> source/SmartGalleryOrganizer/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build APK
        run: gradle -p source/SmartGalleryOrganizer assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-APK
          path: source/SmartGalleryOrganizer/app/build/outputs/apk/debug/app-debug.apk
